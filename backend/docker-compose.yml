version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: mi_negocio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mi_negocio}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase_schema.sql:/docker-entrypoint-initdb.d/01_supabase_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data:
    driver: local
